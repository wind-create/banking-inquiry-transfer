services:

  postgres:
    image: postgres:17
    container_name: banking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10

    volumes:
      - banking_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7.4-alpine
    container_name: banking-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - banking_redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka:
    image: apache/kafka:3.9.0
    container_name: banking-kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:9094:9094"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - banking_kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10


  debezium:
    image: quay.io/debezium/connect:3.0
    container_name: banking-debezium
    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy

      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8084:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:9092

      # Gunakan group baru agar tidak memakai
      # state Kafka Connect lama yang bermasalah
      GROUP_ID: banking-debezium-connect-v2

      # Internal Kafka Connect topics baru
      CONFIG_STORAGE_TOPIC: banking_connect_configs_v2

      OFFSET_STORAGE_TOPIC: banking_connect_offsets_v2

      STATUS_STORAGE_TOPIC: banking_connect_statuses_v2

      CONFIG_STORAGE_REPLICATION_FACTOR: 1

      OFFSET_STORAGE_REPLICATION_FACTOR: 1

      STATUS_STORAGE_REPLICATION_FACTOR: 1


volumes:
  banking_postgres_data:
  banking_redis_data:
  banking_kafka_data: