spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:banking_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.sql.init.mode=never

# Persistent JWT signing key
app.security.jwt.key-store=${JWT_KEYSTORE_LOCATION:file:./local-secrets/banking-jwt.p12}
app.security.jwt.key-store-password=${JWT_KEYSTORE_PASSWORD}
app.security.jwt.key-alias=banking-jwt
app.security.jwt.key-id=banking-dev-rsa-1

