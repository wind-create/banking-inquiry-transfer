spring.application.name=transaction-service
server.port=8083

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:transaction_db}
spring.datasource.username=${DB_USERNAME:banking_admin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:8081/oauth2/jwks}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.cache.transaction-history.ttl=1m

management.endpoints.web.exposure.include=health,info

app.grpc.account.host=${ACCOUNT_GRPC_HOST:localhost}
app.grpc.account.port=${ACCOUNT_GRPC_PORT:9092}
app.grpc.account.deadline=3s

logging.structured.format.console=logstash


spring.cloud.gateway.server.webflux.routes[1].id=transaction-service

spring.cloud.gateway.server.webflux.routes[1].uri=${TRANSACTION_SERVICE_URL:http://localhost:8083}

spring.cloud.gateway.server.webflux.routes[1].order=-10

spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/transfers,/api/v1/transfers/**,/api/v1/accounts/*/transactions