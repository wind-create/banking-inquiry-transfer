apiVersion: v1
kind: Service

metadata:
  name: kafka-headless
  namespace: banking

spec:
  clusterIP: None

  # Penting untuk StatefulSet/KRaft.
  # DNS pod tetap tersedia walaupun pod belum Ready.
  publishNotReadyAddresses: true

  selector:
    app: kafka

  ports:
    - name: internal
      port: 9092
      targetPort: 9092
      protocol: TCP

    - name: controller
      port: 9093
      targetPort: 9093
      protocol: TCP

---

apiVersion: v1
kind: Service

metadata:
  name: kafka
  namespace: banking

spec:
  type: ClusterIP

  selector:
    app: kafka

  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      protocol: TCP