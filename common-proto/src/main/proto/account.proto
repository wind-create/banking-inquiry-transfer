syntax = "proto3";

package banking.account;

option java_multiple_files = true;
option java_package = "com.windlabs.banking.grpc.account";
option java_outer_classname = "AccountProto";

service AccountGrpcService {

    rpc GetAccount(GetAccountRequest)
        returns (GetAccountResponse);

    rpc ValidateOwnership(ValidateOwnershipRequest)
        returns (ValidateOwnershipResponse);

    rpc ExecuteTransfer(ExecuteTransferRequest)
        returns (ExecuteTransferResponse);
}

message GetAccountRequest {
    string account_number = 1;
}

message GetAccountResponse {
    string account_number = 1;
    string customer_id = 2;
    string currency = 3;
    string status = 4;
}

message ValidateOwnershipRequest {
    string customer_id = 1;
    string account_number = 2;
}

message ValidateOwnershipResponse {
    bool valid = 1;
}

message ExecuteTransferRequest {
    string customer_id = 1;
    string idempotency_key = 2;

    string source_account_number = 3;
    string destination_account_number = 4;

    // Decimal dikirim sebagai string agar tidak kehilangan precision.
    string amount = 5;
    string currency = 6;
}

message ExecuteTransferResponse {
    string transfer_id = 1;

    string source_account_number = 2;
    string destination_account_number = 3;

    string amount = 4;
    string currency = 5;

    string source_balance_after = 6;
    string destination_balance_after = 7;

    string processed_on = 8;

    bool replayed = 9;
}