spring.application.name=account-service

server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:account_db}
spring.datasource.username=${DB_USERNAME:banking_admin}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized


# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:8081/oauth2/jwks}


app.grpc.server.port=${GRPC_SERVER_PORT:9092}

spring.cloud.gateway.server.webflux.routes[0].id=account-service

spring.cloud.gateway.server.webflux.routes[0].uri=${ACCOUNT_SERVICE_URL:http://localhost:8082}

spring.cloud.gateway.server.webflux.routes[0].order=0

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/customers/**,/api/v1/accounts/**